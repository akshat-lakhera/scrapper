<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wireless Noise Cancelling Headphones - Example Store</title>
</head>
<body>
  <div class="product-container">
    <h1 class="product-title">Wireless Headphones</h1>
    <div class="product-price-box">
      <span class="product-price">₹4,999</span>
      <span class="currency">INR</span>
    </div>
    <div class="stock-status">
      <span class="availability">In stock</span>
    </div>
    <div class="rating-box">
      <span class="product-rating">4.4</span> / 5
      <span class="review-count">1280 reviews</span>
    </div>
    <div class="seller-info">
      Sold by <span class="seller-name">Example Store</span>
    </div>
    <div class="specifications">
      <h3>Specifications</h3>
      <ul>
        <li><strong class="spec-key">Battery Life:</strong> <span class="spec-value">40 hours</span></li>
        <li><strong class="spec-key">Connectivity:</strong> <span class="spec-value">Bluetooth 5.3</span></li>
        <li><strong class="spec-key">Color:</strong> <span class="spec-value">Matte Black</span></li>
      </ul>
    </div>
    <img class="product-image" src="https://example.com/images/headphones.jpg" alt="Wireless Headphones" />
    <a class="product-url" href="https://demo.local/products/wireless-headphones">View Product Page</a>
  </div>
</body>
</html>
