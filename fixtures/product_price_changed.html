<!DOCTYPE html>
<html lang="en">
<head>

  <title>Wireless Headphones Sale - Example Store</title>
</head>
<body>
  <div class="product-container">
    <h1 class="product-title">Wireless Headphones</h1>
    <div class="product-price-box">
      <span class="product-price">₹3,999</span>
      <span class="currency">INR</span>

</html>
